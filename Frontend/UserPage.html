<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Diary</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style type="text/css">

    * {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  padding: 0;
}

body {
  background: #f0f2f8;
  color: #333;
}

.app {
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.user {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  margin-bottom: 30px;
}

.avatar {
  width: 40px;
  height: 40px;
  background: #5a67d8;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.add-task {
  background: #5a67d8;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 20px;
  transition: background 0.3s;
}

.add-task:hover {
  background: #434aa8;
}

.menu a {
  display: block;
  padding: 10px;
  border-radius: 6px;
  text-decoration: none;
  color: #333;
  margin-bottom: 8px;
  transition: background 0.3s;
}

.menu a.active, .menu a:hover {
  background: #e0e4ff;
}

footer {
  margin-top: auto;
  font-size: 13px;
}

footer a {
  display: block;
  margin-top: 10px;
  color: #555;
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}

/* Mainn Sect */
.main-section {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
}

.entry-form {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  margin-bottom: 40px;
}

.entry-form h1 {
  margin-bottom: 10px;
  color: #5a67d8;
}

.entry-form p {
  margin-bottom: 20px;
  color: #666;
}

.input-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 20px;
}

.input-group label {
  margin-bottom: 6px;
  font-weight: 500;
}

.input-group input,
.input-group textarea {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
  resize: vertical;
}

.input-group textarea {
  min-height: 100px;
}

.save-btn {
  background: #5a67d8;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s;
}

.save-btn:hover {
  background: #434aa8;
}


/* Entries Section */
.entries h2 {
  margin-bottom: 20px;
  color: #5a67d8;
}

.entry-item {
  background: #fff;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 16px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.05);
}

.entry-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
  color: #555;
}

.entry-header i {
  margin-right: 4px;
}

  </style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="user">
      <div class="avatar">U</div>
      <span>User</span>
    </div>

    <button class="add-task">+ Add Entry</button>

    <nav class="menu">
      <a class="active" href="#">Welcome</a>
      <a href="#">Create</a>
      <a href="#">View Entries</a>
      <a href="#">Summary</a>
    </nav>

    <footer>
      <a href="#">Help & resources</a>
      <a href="Homepage.html"><i class="fa-solid fa-user-tie"></i> Logout</a>
    </footer>
  </aside>

  <!-- Main -->
  <section class="main-section">

    <div class="entry-form">
      <h1>Dream Diary</h1>
      <div class="input-group">
        <label for="dreamTitle">Title:</label>
        <input type="dreamTitle" id="dreamTitle">
      </div>
      <p>Record your dreams below:</p>

      <div class="input-group">
        <label for="dreamDate">Date:</label>
        <input type="date" id="dreamDate">
      </div>

      <div class="input-group">
        <label for="dreamTime">Time:</label>
        <input type="time" id="dreamTime">
      </div>

      <div class="input-group">
        <label for="dreamText">Your Dream:</label>
        <textarea id="dreamText" placeholder="Describe your dream..."></textarea>
      </div>

      <button class="save-btn" onclick="#">Save Entry</button>
    </div>

    <div class="entries">
      <h2>Your Entries</h2>
      <div id="entriesList"></div>
    </div>

  </section>
</div>

<script>


</script>

</body>
</html>
