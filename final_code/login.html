<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>User Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="login-box">
    <h2><a href="Homepage.html">Dream Diary</a></h2>
    <h1>LOGIN</h1>

    <form action="login.php" method="POST" onsubmit="return validate()">

      <label>Email or Username</label>
      <input type="text" name="login" id="login" placeholder="Enter Email or Username">

      <label>Password</label>
      <input type="password" name="password" id="password" placeholder="Enter Password">

      <button type="submit" class="login-btn">Login</button>

    </form>

    <p class="signup">
      Don’t have an account? <a href="register.html">Sign up</a>
    </p>

  </div>
</div>

<script>
function validate() {
  var login = document.getElementById("login").value;
  var password = document.getElementById("password").value;

  if (login.trim() == "") {
    alert("Please enter email or username");
    return false;
  }

  if (password.trim() == "") {
    alert("Please enter password");
    return false;
  }

  return true;
}
</script>

</body>
</html>
